<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Balance Scale</title><style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#070b16;--panel:#101827;--panel2:#151f32;--line:#27334b;--text:#f8fafc;--muted:#94a3b8;--accent:#6366f1;--accent2:#818cf8;--danger:#fb7185;--gold:#fbbf24;--green:#a3e635}
body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2440 0,#0b1020 38%,#070b16 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{width:min(720px,100%);margin:auto;padding:18px 14px 40px}
header{text-align:center;padding:8px 0 18px;display:block;width:100%}
h1{font-size:clamp(28px,7vw,42px);letter-spacing:2px;margin:0 auto;font-weight:950;text-align:center;width:100%;display:flex;align-items:center;justify-content:center}
.setup,.result-card,.players-card,.rules-card,.selection-panel,.scale-container{background:linear-gradient(180deg,rgba(21,31,50,.96),rgba(12,19,34,.96));border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.25)}
.setup{padding:22px;margin-top:10px}
.setup h2{margin:0 0 18px;font-size:22px}
label{display:block;margin:14px 0 7px;font-weight:800;color:#dbeafe}
input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid #394762;background:#080f1e;color:white;font-size:18px;outline:none}
input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
button{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,var(--accent),#4f46e5);color:white;font-weight:900;font-size:16px;margin-top:14px;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.985)}
.secondary{background:#293650}
.hidden{display:none!important}
.error{color:#fda4af;margin-top:8px;font-size:14px;font-weight:700}
.game-screen{margin-top:4px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.round{font-size:15px;font-weight:950;letter-spacing:1px;color:#c7d2fe;background:#111a2d;border:1px solid var(--line);padding:9px 12px;border-radius:12px}
.scale-container{padding:9px 14px;display:flex;flex-direction:column;align-items:center;min-width:145px}
.scale-wrapper{width:135px;height:72px}
.scale-svg{width:100%;height:100%;overflow:visible}
.acid-fill{transition:height .5s ease-in-out,y .5s ease-in-out}
.acid-wave{animation:wave 2s infinite linear}
@keyframes wave{0%{transform:translateX(0)}100%{transform:translateX(-20px)}}
.overflowing .scale-pan-left{animation:shake .4s infinite alternate}
@keyframes shake{0%{transform:rotate(0)}100%{transform:rotate(-4deg)}}
.spill-drop{opacity:0}
.overflowing .spill-drop{animation:drip 1.2s infinite ease-in}
.spill-drop-2{animation-delay:.4s!important}
@keyframes drip{0%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:1;transform:translateY(35px) scale(1)}100%{opacity:0;transform:translateY(40px) scale(0)}}
.life-text{font-size:12px;font-weight:950;color:#7dd3fc}
.player-turn{text-align:center;font-size:clamp(23px,6vw,32px);font-weight:950;margin:16px 0 12px}
.selection-panel{padding:14px;margin-bottom:14px}
.instruction{text-align:center;color:#cbd5e1;font-weight:800;margin:0 0 12px}
.selection{text-align:center;color:#a5b4fc;min-height:24px;margin-top:9px;font-weight:900}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;width:100%;margin:auto}
.num{aspect-ratio:1/1;padding:0;margin:0;border-radius:9px;background:#121c2e;border:1px solid #2b3852;color:#f8fafc;font-size:clamp(11px,3.1vw,17px);font-weight:900;display:flex;align-items:center;justify-content:center}
.num:hover{background:#1b2942;border-color:#465777}
.num.selected{background:linear-gradient(135deg,var(--accent),#4f46e5);border-color:#a5b4fc;transform:scale(.95);box-shadow:0 5px 16px rgba(79,70,229,.3)}
.select-btn{margin-top:13px}
.rules-card{padding:16px;margin:14px 0}
.rules-card h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.rules-card h3:before{content:"📋"}
.rules-card div{color:#cbd5e1;font-size:14px;line-height:1.55;padding:5px 0}
.rules-card .rule-timer{margin-top:9px;padding:10px 12px;background:#0b1323;border-radius:11px;color:#fbbf24;font-weight:900}
.new-rule{margin-top:13px;padding:13px;border-radius:13px;background:linear-gradient(135deg,rgba(251,191,36,.13),rgba(245,158,11,.05));border:1px solid rgba(251,191,36,.35)}
.new-rule .new-rule-title{color:#fbbf24;font-weight:950;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.players-card{padding:16px;margin-top:14px}
.players-card h2,.result-card h2{margin:0 0 12px;font-size:19px}
.player{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:#0b1323;border:1px solid #1d2a40;border-radius:12px;margin:7px 0}
.elim{opacity:.45}
.life{font-weight:950;color:#7dd3
